name: 'novadrive'
version: '1.0.0'
config-version: 2

profile: 'novadrive'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  novadrive:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      dimensions:
        +schema: marts
      facts:
        +schema: marts
      analysis:
        +schema: analytics
